<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Language Lab | "bahasabahasa"</title>

  <meta
    name="description"
    content="Join the bahasabahasa Language Lab and build your language identity."
  >

  <link
    rel="icon"
    href="../assets/icon/bahasabahasa-favicon-32.png"
    sizes="any"
  >

  <link
    rel="stylesheet"
    href="../css/app/app.css"
  >
</head>

<body>
  <div class="app-shell">

    <header class="app-header">
      <a
        class="app-brand"
        href="../"
        aria-label="bahasabahasa home"
      >
        "bahasabahasa"
      </a>

      <span class="app-context">
        Language Lab
      </span>
    </header>

    <div class="app-layout">

      <aside
        class="app-sidebar"
        aria-label="Language Lab navigation"
      >
        <nav class="app-nav">
          <a
            class="app-nav__link app-nav__link--active"
            href="#home"
            aria-current="page"
          >
            Home
          </a>

          <a
            class="app-nav__link"
            href="#profile"
          >
            Profile
          </a>

          <a
            class="app-nav__link"
            href="#languages"
          >
            My Languages
          </a>

          <a
            class="app-nav__link"
            href="#participation"
          >
            Participation
          </a>

          <a
            class="app-nav__link"
            href="#lab"
          >
            Language Lab
          </a>
        </nav>
      </aside>

      <main
        class="app-main"
        id="main-content"
        tabindex="-1"
      >
        <div
          id="app-view"
          class="app-view"
          aria-live="polite"
        ></div>
      </main>

    </div>

    <footer class="app-footer">
      <p>
        "bahasabahasa" — Human Language Infrastructure
      </p>
    </footer>

  </div>

  <script
    type="module"
    src="../js/app/app.js"
  ></script>
</body>
</html>
